name: Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: production
      commit_sha:
        description: Immutable commit verified by Deploy Button
        required: true
      deployment_id:
        description: Stable Deploy Button request identity
        required: true
run-name: Deploy Button ${{ inputs.deployment_id }}
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DEPLOY_BUTTON_BUILD_SPEC: 8894644e38693a94c2b1725cffe422133d1ba22976da8feb408a4610b86912d6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pull Vercel production settings
        run: npx --yes vercel@59.10.0 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Apply reviewed application settings
        run: |-
          node <<'DEPLOY_BUTTON_CONFIG'
          const fs = require('node:fs');
          const path = "vercel.json";
          const previous = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : {};
          const reviewed = {"installCommand":"npm ci"};

          fs.writeFileSync(path, JSON.stringify({ ...previous, ...reviewed }, null, 2));
          DEPLOY_BUTTON_CONFIG
      - name: Build immutable Vercel output
        run: npx --yes vercel@59.10.0 build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy immutable build to Vercel
        run: npx --yes vercel@59.10.0 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: .
